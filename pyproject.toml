[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-aware-video-object-removal"
version = "0.1.0"
description = "Research pipeline for identity-aware video object removal, VOID-compatible quadmask export, and crowded-scene diagnostics."
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<3",
  "tqdm>=4.66,<5",
  "pillow>=9.4,<12",
  "scipy>=1.10,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "celery[redis]>=5.3,<6",
  "redis>=5,<6",
]

[project.scripts]
video-logo-remover = "logo_removal.cli:main"
video-logo-remover-web = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
